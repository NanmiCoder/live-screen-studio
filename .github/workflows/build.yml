name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            arch: arm64
          - name: macos-intel
            arch: x86_64
    # 两个架构都在 Apple 芯片的 runner 上编译，x86_64 为交叉编译，不依赖已逐步下线的 Intel runner
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build LiveZoom.app (${{ matrix.arch }})
        run: ARCH=${{ matrix.arch }} scripts/build-app.sh

      - name: Check architecture
        run: |
          lipo -info build/LiveZoom.app/Contents/MacOS/LiveZoom
          lipo -info build/LiveZoom.app/Contents/MacOS/LiveZoom | grep -q "${{ matrix.arch }}"

      - name: Package
        id: pkg
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          zip="LiveZoom-${version}-${{ matrix.name }}.zip"
          ditto -c -k --keepParent build/LiveZoom.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveZoom-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  release:
    # 推送 v* 标签时，把两个版本发布到 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LiveZoom ${GITHUB_REF_NAME#v}" \
            --generate-notes
